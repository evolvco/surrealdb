services:
  pd:
    image: pingcap/pd:v8.5.0
    ports:
      - "2379:2379"
    volumes:
      - pd-data:/data
    command:
      - --name=pd
      - --data-dir=/data
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2379/pd/api/v1/members || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  tikv:
    image: pingcap/tikv:v8.5.0
    depends_on:
      pd:
        condition: service_healthy
    ports:
      - "20160:20160"
    volumes:
      - tikv-data:/data
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --data-dir=/data
      - --pd-endpoints=pd:2379

volumes:
  pd-data:
  tikv-data:
